server:
  port: 8788
  # Interface the MCP endpoint binds to. Unset listens on every interface.
  # host: 0.0.0.0
  admin_port: 8789
  # Interface the admin API and /metrics bind to. Defaults to 0.0.0.0 (all
  # interfaces), which a container needs. Outside a container set 127.0.0.1
  # unless a reverse proxy on another host must reach it.
  # admin_host: 127.0.0.1
  admin_token_env: SPLICEDOCK_ADMIN_TOKEN
  # Env var holding a bearer token that Prometheus must send to scrape /metrics.
  # If the env var is unset or empty, /metrics stays unauthenticated.
  metrics_token_env: SPLICEDOCK_METRICS_TOKEN
  # Require a profile bearer token for MCP connections (default true). Set false
  # only to allow the unauthenticated ?profile= selection on a trusted network.
  require_profile_token: true
  # Optional named admin tokens. The matched name is recorded as the approver
  # identity on approvals. Each entry sets exactly one of token_env/token_file.
  # The name "admin" is reserved for the token configured in admin_token_env.
  # admin_tokens:
  #   - name: alice
  #     token_env: SPLICEDOCK_ADMIN_TOKEN_ALICE
  #   - name: bob
  #     token_file: /path/to/bob-token-file
  # Commands that cli and cli_passthrough tools may run. A tool whose command is
  # not listed here is refused. Entries match the tool's `command` exactly.
  cli_whitelist:
    - gh
    - codex
  # Strong (WebAuthn passkey) consent for approvals. It is enabled by default and
  # the gateway refuses to start without rp_id and origin. rp_id is the WebAuthn
  # relying-party ID (the domain passkeys are bound to); origin is the HTTPS
  # origin the admin UI is served from, on rp_id or a subdomain of it. Set
  # enabled: false only for local use without passkey approvals.
  consent:
    enabled: true
    rp_id: splicedock.example.com
    origin: https://splicedock.example.com

# Minted credentials: instead of a pre-created secret, a provider can issue one
# per profile on first use. The broker caches it (memory), persists it (Vault)
# and refreshes it before expiry; deleting a profile revokes and purges it.
# credential_providers:
#   mint_example:
#     type: command                    # any CLI that prints a credential
#     command: /usr/local/bin/mint-credential
#     args: ["--profile", "{profile}", "--agent", "{agent}"]
#     timeout_ms: 10000
#     ttl_seconds: 3600
#     output: { format: json, secret_field: token, expires_in_field: expires_in }
# credential_storage:
#   type: vault                        # default; 'memory' for local experiments
#   prefix: secret/data/example/splicedock/minted
# Applies to every profile without its own entry for that tool — this is what
# makes a profile created later (even at runtime) automatically credentialed.
# credential_defaults:
#   gh:
#     env:
#       - name: GH_TOKEN
#         mint: mint_example

profiles:
  default:
    tools:
      - "*"

  ops:
    tools:
      - "vault__*"
      - "grafana__*"
    # Optional per-profile credentials, keyed by tool name. Without them every
    # profile shares the tool-level credential (one upstream connection / one
    # CLI identity). Each entry sets exactly one of:
    #   auth:  mcp_proxy backend — the profile gets its OWN upstream connection
    #          with this credential instead of the shared one.
    #   env:   cli_passthrough tool — replaces same-named env refs of the tool
    #          for this profile's child process.
    # Inside auth/env, use { from: "env:..." | "vault:..." } for an existing
    # secret or { mint: <credential_providers name> } for one issued on demand.
    # A key that names no tool, or refuses the matching shape, fails startup.
    # Tool discovery at startup still uses the tool-level credential.
    # credentials:
    #   vault:
    #     auth:
    #       type: bearer
    #       token: { from: vault:secret/data/example/splicedock#worker_vault_token }
    #   gh:
    #     env:
    #       - name: GH_TOKEN
    #         from: vault:secret/data/example/github#worker_pat

tools:
  # mcp_proxy backends. Replace each service_dns/port with the host and port of
  # your own MCP server; transport is streamable_http (default) or sse.
  - type: mcp_proxy
    name: vault
    description: "HashiCorp Vault secrets - read and write KV secrets"
    service_dns: vault-mcp.example.internal
    port: 8000
    transport: sse

  - type: mcp_proxy
    name: grafana
    description: "Observability - Prometheus metrics, Loki logs, dashboards, alerts"
    service_dns: grafana-mcp.example.internal
    port: 8000
    transport: sse

  - type: mcp_proxy
    name: memory
    description: "Structured knowledge graph - entities and relations for cross-session semantic memory"
    service_dns: memory-mcp.example.internal
    port: 8000
    transport: sse

  - type: mcp_proxy
    name: sequential_thinking
    description: "Chain-of-thought scratchpad for step-by-step reasoning on complex problems"
    service_dns: sequential-thinking-mcp.example.internal
    port: 8000
    transport: sse

  - type: mcp_proxy
    name: context7
    description: "Up-to-date library and framework documentation lookup"
    service_dns: context7-mcp.example.internal
    port: 8000
    transport: sse

  - type: mcp_proxy
    name: lightpanda
    description: "Headless browser automation - navigate, click, fill forms, extract content from web pages"
    service_dns: lightpanda-mcp.example.internal
    port: 8000
    transport: sse

  # CLI passthroughs — Splicedock provisions these at startup into $SPLICEDOCK_BIN.
  # The install scripts below need curl, tar and sha256sum (gh on Linux) and npm
  # (codex). A failed install is logged and the tool is skipped unless
  # `install.required: true`.
  # Each produces two tools: <name>__help (capability discovery) and <name>__run (invocation
  # with a typed argv array, no shell parsing).
  - type: cli_passthrough
    name: gh
    description: "GitHub CLI — repos, pull requests, issues, code search, releases, actions"
    command: gh
    deny_subcommands: ["auth", "config", "secret", "variable", "alias"]
    env:
      - GH_TOKEN
    install:
      env:
        GH_VERSION: "2.102.0"  # keep in sync with PINNED_GH_VERSION
      script: |
        case "$(uname -sm)" in
          "Linux x86_64")
            arch=amd64
            sha256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
          "Linux aarch64"|"Linux arm64")
            arch=arm64
            sha256=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
          *) echo "Install gh manually on this platform" >&2; exit 1 ;;
        esac
        release="gh_${GH_VERSION}_linux_${arch}"
        archive="$(mktemp)"
        trap 'unlink "$archive"' EXIT
        curl -fsSL -o "$archive" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${release}.tar.gz"
        printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
        tar xzf "$archive" --strip-components=2 -C "$SPLICEDOCK_BIN" "$release/bin/gh"
        "$SPLICEDOCK_BIN/gh" --version

  - type: cli_passthrough
    name: codex
    description: "OpenAI Codex CLI — delegate coding tasks to an independent Codex agent"
    command: codex
    env:
      - OPENAI_API_KEY
    install:
      script: |
        npm install -g @openai/codex@latest
        [ -f "$SPLICEDOCK_BIN/bin/codex" ] && ln -sf "$SPLICEDOCK_BIN/bin/codex" "$SPLICEDOCK_BIN/codex"
