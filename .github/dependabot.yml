version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Dependabot cannot tell LTS from non-LTS Node releases. The image follows
    # Node LTS lines only; move to the next LTS by hand.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
