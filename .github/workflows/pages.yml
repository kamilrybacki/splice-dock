name: Docs
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted runners only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The docs scripts use only Node built-ins, so no npm ci is needed.
      # site/config.json holds the absolute site URL, so no configure-pages step.
      - name: Build and validate user documentation
        run: node scripts/build-docs.mjs && node scripts/check-docs.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
