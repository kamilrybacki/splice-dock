name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # GitHub-hosted runners only: pull requests from forks must never execute on
    # self-hosted infrastructure.
    runs-on: ubuntu-latest
    # Throwaway Postgres for the real-Postgres race suites. The password is a
    # fixed test literal for this disposable container, not a secret.
    services:
      postgres:
        image: postgres:16-alpine@sha256:e0e53cfa0884f3cc216a621033e4f38dceb49e52218ac77facc8e48f02973093
        env:
          POSTGRES_PASSWORD: splicedock-ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Every publisher (image, npm, release) needs this job, so a release tag
      # that does not match package.json publishes nothing.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Install pinned GitHub CLI for help-table checks
        shell: bash
        run: |
          set -euo pipefail
          version=2.102.0
          # Digests from gh_2.102.0_checksums.txt, cross-checked with a second download.
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              sha256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
              ;;
            aarch64|arm64)
              arch=arm64
              sha256=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484
              ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          archive="gh_${version}_linux_${arch}.tar.gz"
          install_dir="${RUNNER_TEMP}/gh-${version}"
          mkdir -p "$install_dir"
          cd "$install_dir"
          base_url="https://github.com/cli/cli/releases/download/v${version}"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" "$base_url/$archive"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive"
          bin_dir="$install_dir/gh_${version}_linux_${arch}/bin"
          "$bin_dir/gh" --version | grep -F "gh version ${version} "
          echo "$bin_dir" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build and validate user documentation
        run: npm run docs:build && npm run docs:check
      - run: npm run lint
      - name: Layer rules
        run: npm run lint:layers
      - run: npm test
        env:
          SPLICEDOCK_TEST_PG_DSN: postgres://postgres:splicedock-ci-throwaway@localhost:5432/postgres
          # Fail, rather than skip, the real-Postgres suites if the DSN is missing.
          SPLICEDOCK_REQUIRE_PG_TESTS: '1'
      # Packs the checkout, installs the tarball in a fresh node:22-slim
      # container and runs the Quickstart against it.
      - name: Smoke-test the npm package
        run: scripts/smoke/run-npm.sh

  image:
    needs: test
    # main publishes :latest; a release tag (vX.Y.Z) publishes :vX.Y.Z. Both get :<sha>.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # QEMU builds the arm64 variant on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}

  # Pull requests build the amd64 image without pushing and smoke-test it, so a
  # broken image fails before merge rather than on main.
  image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: splicedock:ci
      # SQLite on a network with no egress, then a migration to PostgreSQL and
      # two gateways on the same database.
      - name: Smoke-test the image
        run: scripts/smoke/run-image.sh
        env:
          IMG: splicedock:ci

  npm:
    needs: test
    # A release tag (vX.Y.Z) publishes the same version to the npm registry.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no long-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # The tag/version check runs in the test job, which this job needs.
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.3
      - run: npm ci
      # Trusted publishing can only be configured for a package that already
      # exists, so the first version is published by hand. Skipping a version
      # that is already on the registry keeps this job, and the release job
      # that needs it, green for that tag.
      - name: Skip if this version is already on npm
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "splicedock@${version}" version >/dev/null 2>&1; then
            echo "splicedock@${version} is already on npm; skipping publish" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

  release:
    needs: [image, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
