    <text x="103" y="162" fill="#bdbdb5" font-size="15">PROFILE TOKEN</text>
  </g>

  <path d="M244 96h194l17 17v79H244z" fill="#080808" stroke="#c9d99a" stroke-width="2"/>
  <path fill="#c9d99a" d="M238 90h194l17 17v79H238z"/>
