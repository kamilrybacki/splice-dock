<svg xmlns="http://www.w3.org/2000/svg" width="704" height="288" viewBox="0 0 704 288" role="img" aria-labelledby="title desc">
  <title id="title">One MCP endpoint for three kinds of backend</title>
  <desc id="desc">An MCP client sends a request to Splicedock. The gateway uses a profile and backend credentials to route the call to an MCP server, an HTTP API, or a CLI tool.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
