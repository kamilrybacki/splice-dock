    <text x="343" y="150" font-size="18">POST /mcp</text>
    <text x="343" y="173" font-size="15">PROFILE + CREDENTIALS</text>
  </g>

  <g fill="#181818" stroke="#8c8c81" stroke-width="2">
    <path d="M521 37h145l10 10v44H521z"/>
